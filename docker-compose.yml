services:
  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: truckconnect
      POSTGRES_PASSWORD: truckconnect_dev
      POSTGRES_DB: truckconnect
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckconnect -d truckconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://truckconnect:truckconnect_dev@postgres:5432/truckconnect
      NEXTAUTH_SECRET: local-dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      SOCKET_PORT: "3000"
      NODE_ENV: production
      # LiveKit – internal Docker network address
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecretchangeinproduction32xxx
      # Ably – real-time pub/sub (set your actual key here or via .env file)
      ABLY_API_KEY: ${ABLY_API_KEY}
      # Redis – OSRM route cache
      REDIS_URL: redis://redis:6379
      # Kafka – points at the kafka service on the internal Docker network (INTERNAL listener)
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "true"
    volumes:
      # Persist uploaded audio files across container restarts
      - uploads_data:/app/public/uploads

  # ── LiveKit WebRTC SFU ───────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    ports:
      - "7880:7880"   # HTTP API
      - "7881:7881"   # RTC TCP
      - "7882:7882/udp" # RTC UDP
    volumes:
      - ./docker/livekit:/etc/livekit
    command: --config /etc/livekit/livekit.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis — OSRM route cache + optional horizontal scaling ─────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RedisInsight — web UI for browsing Redis data ──────────────
  redisinsight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

  # ── Kafka (KRaft mode — no ZooKeeper) ─────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    restart: unless-stopped
    ports:
      - "9092:9092"   # external access for local tooling / Kafka UI
    environment:
      # KRaft — combined broker+controller, no ZooKeeper required
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL = Docker-to-Docker, EXTERNAL = host machine via localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Auto-create topics is OFF — kafka-init.ts handles provisioning explicitly
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single-node dev settings (set to 3 for multi-broker production)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      # Fixed cluster ID required for KRaft (base64-encoded, 22 chars)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka UI ────────────────────────────────────────────────
  # Dashboard for monitoring topics, consumer lag, and DLQ messages.
  # Access at http://localhost:8080 (restrict access in production!)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: trucknet-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ── Stress-signal Kafka consumer (worker) ──────────────────────
  # Separate process: consumes from trucknet.stress-signals and fans out
  # to nearby drivers via Ably. Scale horizontally with --scale stress-worker=3.
  stress-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://truckconnect:truckconnect_dev@postgres:5432/truckconnect
      NEXTAUTH_SECRET: local-dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecretchangeinproduction32xxx
      ABLY_API_KEY: ${ABLY_API_KEY}
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "true"

  # ── MQTT Sensor Consumer (IoT worker) ──────────────────────────────
  # Subscribes to MQTT, validates readings, persists to DB, fans out via Ably.
  sensor-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://truckconnect:truckconnect_dev@postgres:5432/truckconnect
      NEXTAUTH_SECRET: local-dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
      ABLY_API_KEY: ${ABLY_API_KEY}
      MQTT_URL: mqtt://trucknet:${MQTT_PASSWORD}@mosquitto:1883
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "false"

  # ── ESG Report Worker (BullMQ) ─────────────────────────────────────
  # Processes driver-esg-reports queue jobs: aggregates KPIs, generates
  # PDF/CSV via Puppeteer, emails HR. Requires Redis + Postgres.
  esg-worker:
    build:
      context: .
      dockerfile: Dockerfile.esg-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://truckconnect:truckconnect_dev@postgres:5432/truckconnect
      NEXTAUTH_SECRET: local-dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      ABLY_API_KEY: ${ABLY_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@trucknet.local}

  # ── Behaviour Event Consumer (MQTT → DB) ──────────────────────
  # Subscribes to trucknet/drivers/+/behaviour, validates events,
  # inserts into driving_events, fans out critical alerts via Ably.
  behaviour-event-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    command: node_modules/.bin/tsx workers/behaviour-event-consumer.ts
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://truckconnect:truckconnect_dev@postgres:5432/truckconnect
      NEXTAUTH_SECRET: local-dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
      ABLY_API_KEY: ${ABLY_API_KEY}
      MQTT_URL: mqtt://trucknet:${MQTT_PASSWORD}@mosquitto:1883
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "false"

  # ── Behaviour Report Worker (BullMQ) ───────────────────────────
  # Processes behaviour-reports queue: calculates driving scores,
  # inserts behaviour_reports row, notifies admin via Ably.
  behaviour-report-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    command: node_modules/.bin/tsx workers/behaviour-report-worker.ts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://truckconnect:truckconnect_dev@postgres:5432/truckconnect
      NEXTAUTH_SECRET: local-dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      ABLY_API_KEY: ${ABLY_API_KEY}
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENABLED: "false"

  # ── Eclipse Mosquitto MQTT Broker ──────────────────────────────
  # Receives sensor readings from ESP32 devices on port 1883.
  # WebSocket listener on 9001 for browser-based debugging tools.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: trucknet-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -u trucknet -P ${MQTT_PASSWORD} -W 3 || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
  kafka_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
