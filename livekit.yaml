# LiveKit Server configuration – local development / Docker Compose
# Documentation: https://docs.livekit.io/realtime/self-hosting/configuration/

port: 7880

# WebRTC media ports
rtc:
  tcp_port: 7881
  udp_port: 7882
  # Use host networking for proper WebRTC ICE; update external_ip in production
  use_external_ip: false

# API keys – format: "key: secret"
# In production, mount this file as a secret or pass LIVEKIT_KEYS env var instead
keys:
  devkey: devsecretchangeinproduction

# Logging
logging:
  level: info

# Room defaults
room:
  # Auto-delete empty rooms after 30 seconds (matches the call flow)
  empty_timeout: 30
  # Max participants per room (1-on-1 calls)
  max_participants: 2

# TURN relay – enables calls through firewalls / cellular NAT
# Uncomment and configure for production deployments
# turn:
#   enabled: true
#   domain: turn.yourdomain.com
#   cert_file: /path/to/cert.pem
#   key_file: /path/to/key.pem
#   tls_port: 5349
#   udp_port: 3478
#   external_tls: true
